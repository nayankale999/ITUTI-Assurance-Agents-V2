# watsonx Orchestrate external agent: the Risk classifier of Ituti AI Assurance (A2A protocol 0.3.0).
# Import with the watsonx Orchestrate ADK:  orchestrate agents import -f ibm/specialists/risk-classifier.yaml
# Or in the UI: add an external agent, choose A2A 0.3.0 and enter the api_url below.
# Replace the token with the client's Ituti AI Assurance API key. Never commit a real key.
spec_version: v1
kind: external
name: ituti_risk_classifier
title: "Ituti AI Assurance: Risk classifier"
nickname: ituti_risk_classifier
provider: external_chat/A2A/0.3.0
description: >
  Pre-fills the AI system profile and its EU AI Act classification (prohibited-practice screens, Annex III
  high-risk areas, transparency triggers) from the evidence. Every answer cites its source and waits for a
  person to review it.
tags:
  - AI governance
  - EU AI Act
  - Ituti AI Assurance crew
api_url: https://assurance.ituti.tech/api/a2a/agents/risk-classifier
auth_scheme: BEARER_TOKEN
auth_config:
  token: ita_REPLACE_WITH_CLIENT_API_KEY
chat_params:
  stream: true
  sendHistory: true
  pushNotifications: false
