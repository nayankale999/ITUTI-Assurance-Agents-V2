# watsonx Orchestrate external agent: the Model researcher of Ituti AI Assurance (A2A protocol 0.3.0).
# Import with the watsonx Orchestrate ADK:  orchestrate agents import -f ibm/specialists/model-researcher.yaml
# Or in the UI: add an external agent, choose A2A 0.3.0 and enter the api_url below.
# Replace the token with the client's Ituti AI Assurance API key. Never commit a real key.
spec_version: v1
kind: external
name: ituti_model_researcher
title: "Ituti AI Assurance: Model researcher"
nickname: ituti_model_researcher
provider: external_chat/A2A/0.3.0
description: >
  Researches what a foundation-model provider publishes about a model (model or system card, usage policy, data
  handling, EU AI Act status) from official sources only, and keeps it in a shared model library.
tags:
  - AI governance
  - EU AI Act
  - Ituti AI Assurance crew
api_url: https://assurance.ituti.tech/api/a2a/agents/model-researcher
auth_scheme: BEARER_TOKEN
auth_config:
  token: ita_REPLACE_WITH_CLIENT_API_KEY
chat_params:
  stream: true
  sendHistory: true
  pushNotifications: false
