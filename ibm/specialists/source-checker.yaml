# watsonx Orchestrate external agent: the Source checker of Ituti AI Assurance (A2A protocol 0.3.0).
# Import with the watsonx Orchestrate ADK:  orchestrate agents import -f ibm/specialists/source-checker.yaml
# Or in the UI: add an external agent, choose A2A 0.3.0 and enter the api_url below.
# Replace the token with the client's Ituti AI Assurance API key. Never commit a real key.
spec_version: v1
kind: external
name: ituti_source_checker
title: "Ituti AI Assurance: Source checker"
nickname: ituti_source_checker
provider: external_chat/A2A/0.3.0
description: >
  Verifies that a quote really appears in a system's evidence documents and returns where. In an assessment it
  checks every source before a proposal reaches a reviewer, and sends back anything it cannot find.
tags:
  - AI governance
  - EU AI Act
  - Ituti AI Assurance crew
api_url: https://assurance.ituti.tech/api/a2a/agents/source-checker
auth_scheme: BEARER_TOKEN
auth_config:
  token: ita_REPLACE_WITH_CLIENT_API_KEY
chat_params:
  stream: true
  sendHistory: true
  pushNotifications: false
