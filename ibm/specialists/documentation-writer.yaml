# watsonx Orchestrate external agent: the Documentation writer of Ituti AI Assurance (A2A protocol 0.3.0).
# Import with the watsonx Orchestrate ADK:  orchestrate agents import -f ibm/specialists/documentation-writer.yaml
# Or in the UI: add an external agent, choose A2A 0.3.0 and enter the api_url below.
# Replace the token with the client's Ituti AI Assurance API key. Never commit a real key.
spec_version: v1
kind: external
name: ituti_documentation
title: "Ituti AI Assurance: Documentation writer"
nickname: ituti_documentation
provider: external_chat/A2A/0.3.0
description: >
  Writes the model card (model, data, intended use, limitations, out-of-scope uses) and the monitoring metrics
  from the evidence and the provider's published documentation.
tags:
  - AI governance
  - EU AI Act
  - Ituti AI Assurance crew
api_url: https://assurance.ituti.tech/api/a2a/agents/documentation-writer
auth_scheme: BEARER_TOKEN
auth_config:
  token: ita_REPLACE_WITH_CLIENT_API_KEY
chat_params:
  stream: true
  sendHistory: true
  pushNotifications: false
