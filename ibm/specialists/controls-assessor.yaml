# watsonx Orchestrate external agent: the Controls assessor of Ituti AI Assurance (A2A protocol 0.3.0).
# Import with the watsonx Orchestrate ADK:  orchestrate agents import -f ibm/specialists/controls-assessor.yaml
# Or in the UI: add an external agent, choose A2A 0.3.0 and enter the api_url below.
# Replace the token with the client's Ituti AI Assurance API key. Never commit a real key.
spec_version: v1
kind: external
name: ituti_controls_assessor
title: "Ituti AI Assurance: Controls assessor"
nickname: ituti_controls_assessor
provider: external_chat/A2A/0.3.0
description: >
  Rates each applicable control (EU AI Act, UK requirements, ISO/IEC 42001, NIST AI RMF) as met, partly met or
  not met from the client's own documents, with evidence notes a reviewer can sign off.
tags:
  - AI governance
  - EU AI Act
  - Ituti AI Assurance crew
api_url: https://assurance.ituti.tech/api/a2a/agents/controls-assessor
auth_scheme: BEARER_TOKEN
auth_config:
  token: ita_REPLACE_WITH_CLIENT_API_KEY
chat_params:
  stream: true
  sendHistory: true
  pushNotifications: false
