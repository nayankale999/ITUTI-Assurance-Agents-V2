# Builds the on-premises package, proves it installs, and publishes it.
#  - On every pull request and push to main touching the app or onprem/: build the bundle and run a real
#    installation (node runtime) against a MariaDB service, then check health, the agents and the admin sign-in.
#  - On a tag like onprem-v1.2.0: also build the container image, push it to GitHub Container Registry and attach
#    the bundle (with the image inside, for servers without registry access) to a GitHub release.
name: On-premises package

on:
  push:
    branches: [main]
    paths: ['src/**', 'onprem/**', 'package*.json', '.github/workflows/onprem-release.yml']
    tags: ['onprem-v*']
  pull_request:
    paths: ['src/**', 'onprem/**', 'package*.json']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  bundle:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/onprem-v* ]]; then echo "version=${GITHUB_REF#refs/tags/onprem-v}" >> "$GITHUB_OUTPUT";
          else echo "version=$(node -p "require('./package.json').version")-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi

      - name: Build the bundle
        run: |
          IMAGE_FLAG=""; [[ "$GITHUB_REF" == refs/tags/onprem-v* ]] && IMAGE_FLAG="--image"
          VERSION=${{ steps.v.outputs.version }} onprem/build-bundle.sh $IMAGE_FLAG

      - name: Install it (node runtime) and check it works
        run: |
          set -e
          mkdir -p /tmp/install && tar -xzf dist/onprem/ituti-ai-assurance-onprem-${{ steps.v.outputs.version }}.tar.gz -C /tmp/install
          cat > /tmp/install/ituti.conf <<'CONF'
          DEPLOY_DIR=/opt/ituti-assurance
          RUNTIME=node
          APP_URL=http://localhost:3000
          APP_PORT=3000
          DB_MODE=external
          DB_HOST=127.0.0.1
          DB_NAME=ituti_assurance
          DB_USER=ituti_app
          DB_PASSWORD=ci-app-password
          DB_ADMIN_USER=root
          DB_ADMIN_PASSWORD=ci-root-password
          STORAGE_PATH=/srv/ituti-assurance/data
          BACKUP_PATH=/srv/ituti-assurance/backups
          ADMIN_EMAIL=admin@example.com
          MONTHLY_BUDGET_USD=100
          CONF
          sed -i 's/^ *//' /tmp/install/ituti.conf
          sudo ln -sf "$(command -v node)" /usr/local/bin/node
          sudo bash /tmp/install/ituti-ai-assurance-onprem-${{ steps.v.outputs.version }}/install.sh install --config /tmp/install/ituti.conf --yes | tee /tmp/install.log
          curl -fsS http://localhost:3000/api/health
          curl -fsS http://localhost:3000/api/a2a/agents | grep -q controls-assessor
          LINK=$(grep -o 'http://localhost:3000/api/auth/callback[^ ]*' /tmp/install.log | head -1)
          curl -fsS -o /dev/null -D - "$LINK" | grep -qi 'set-cookie: next-auth.session-token'
          sudo /opt/ituti-assurance/installer/install.sh backup --yes
          sudo /opt/ituti-assurance/installer/install.sh status --yes

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/onprem-v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        if: startsWith(github.ref, 'refs/tags/onprem-v')
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}:${{ steps.v.outputs.version }}
          docker tag ituti-ai-assurance:${{ steps.v.outputs.version }} "$IMG"
          docker push "$IMG"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/onprem-v')
        uses: softprops/action-gh-release@v2
        with:
          name: On-premises ${{ steps.v.outputs.version }}
          files: |
            dist/onprem/*.tar.gz
            dist/onprem/*.sha256
          body: |
            On-premises package for Ituti AI Assurance ${{ steps.v.outputs.version }}.
            Download the .tar.gz, check it against the .sha256 file, extract it on (or next to) the server, copy
            ituti.conf.example to ituti.conf, fill it in and run `./install.sh install --config ituti.conf`.
            The container image is also available as ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}.
            See README.md in the package.

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/onprem-v') }}
        with:
          name: ituti-ai-assurance-onprem-${{ steps.v.outputs.version }}
          path: dist/onprem/*.tar.gz
          retention-days: 14
