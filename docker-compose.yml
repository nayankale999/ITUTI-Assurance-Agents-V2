# Runs the app on one server, keeping its CSV data files in ./data next to this file.
# 1. Copy .env.example to .env and fill it in.
# 2. mkdir -p data && sudo chown 10001:10001 data   (the container runs as user 10001)
# 3. docker compose up -d --build
# Run exactly one copy of the app: the CSV files must not be shared between servers.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:3000:3000"
