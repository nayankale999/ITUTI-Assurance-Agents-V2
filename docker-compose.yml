# Runs the app and a MariaDB database on one server.
# 1. Copy .env.example to .env and fill it in (DATABASE_URL is set below, so leave it out of .env).
# 2. mkdir -p data && sudo chown 10001:10001 data   (the app runs as user 10001; uploaded documents are kept here)
# 3. docker compose up -d --build
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: assurance
      MARIADB_USER: assurance
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      DATABASE_URL: mysql://assurance:${DB_PASSWORD}@db:3306/assurance
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  db:
