<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 90" width="60" height="90">
  <defs>
    <linearGradient id="beacon" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>

  <!-- Beacon stem -->
  <rect x="21" y="44" width="18" height="38" rx="6" fill="url(#beacon)"/>

  <!-- Static wave hints -->
  <circle cx="30" cy="24" r="20" fill="none" stroke="#00D4FF" stroke-width="1.5" opacity="0.25"/>
  <circle cx="30" cy="24" r="28" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.12"/>
  <circle cx="30" cy="24" r="36" fill="none" stroke="#6C5CE7" stroke-width="0.8" opacity="0.06"/>

  <!-- Core -->
  <circle cx="30" cy="24" r="11" fill="url(#beacon)"/>
  <circle cx="30" cy="24" r="5" fill="#fff"/>
</svg>
